<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proposal Mission 💍 WhatsApp Chat Story</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;500;600;700&display=swap');
    
    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    /* Official WhatsApp Pattern Style Background */
    .chat-bg {
      background-color: #0b141a;
      background-image: radial-gradient(#1f2c34 1px, transparent 1px);
      background-size: 20px 20px;
    }

    .bubble-in {
      background-color: #202c33;
      color: #e9edef;
      border-top-left-radius: 0px;
    }

    .bubble-out {
      background-color: #005c4b;
      color: #e9edef;
      border-top-right-radius: 0px;
    }

    /* Custom scrollbar for authentic chat feel */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.16);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    /* Message pop-in animation */
    @keyframes messagePop {
      0% { opacity: 0; transform: translateY(12px) scale(0.97); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .animate-pop {
      animation: messagePop 0.25s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
    }

    /* Pulse animation for record light */
    @keyframes redPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .pulse-dot {
      animation: redPulse 1.2s infinite;
    }
  </style>
</head>
<body class="h-full flex items-center justify-center p-0 sm:p-4 md:p-6 overflow-hidden text-slate-100">

        <button onclick="openAddMessageModal()" class="p-2 hover:bg-[#2a3942] rounded-full transition text-slate-300" title="Add custom message">

    // App State Variables
    let currentDisplayedIndex = 0;
    let isPlaying = false;
    let autoPlayTimer = null;
    let playSpeed = 1.0;
    let soundEnabled = true;
    let audioCtx = null;

    function playPopSFX() {
      if (!soundEnabled) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.08);
        
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
      } catch (e) {
        console.log('Audio init prevented');
      }
    }

    window.onload = function() {
      renderParticipantsList();
      // Render initial set of messages
      renderAllMessagesUntil(7);
    };

    function renderParticipantsList() {
      const container = document.getElementById('participantList');
      container.innerHTML = '';
      Object.keys(participants).forEach(key => {

        const avatarHtml = p.avatar 
          ? `<img src="${p.avatar}" class="w-8 h-8 rounded-full object-cover">`

          <div class="flex items-center justify-between p-2 rounded-lg bg-[#111b21]">
            <div class="flex items-center gap-2.5">
              ${avatarHtml}
              <div>
                <p class="text-sm font-medium text-slate-200">${p.name} ${p.isMe ? '<span class="text-xs text-slate-500">(You)</span>' : ''}</p>
                <p class="text-[10px] text-slate-400">${p.role}</p>
              </div>
            </div>
            <i class="fa-solid fa-shield-halved text-xs text-emerald-500"></i>
          </div>
        `;
      });
    }

    function createMessageMarkup(msg) {
      if (msg.isDateDivider) {
        return `
          <div class="flex justify-center my-3 message-item">
            <span class="bg-[#182229] border border-slate-800 text-slate-400 text-[11px] font-medium px-3 py-1 rounded-md shadow-sm uppercase tracking-wider">
              ${msg.text}
            </span>
          </div>
        `;
      }

      const pInfo = participants[msg.sender] || { name: msg.sender, color: "text-emerald-400", isMe: false };
      const isMe = pInfo.isMe;

      // Reactions badge generator
      let reactionsHtml = '';
      if (msg.reactions && msg.reactions.length > 0) {
        reactionsHtml = `
          <div class="absolute -bottom-2.5 ${isMe ? 'left-2' : 'right-2'} bg-[#222e35] border border-slate-700/60 rounded-full px-1.5 py-0.5 text-[11px] shadow-md flex items-center gap-0.5 z-10 cursor-pointer hover:scale-110 transition">
            ${msg.reactions.join('')}
          </div>
        `;
      }

      // Content payload switcher
      let contentHtml = '';
      if (msg.type === 'image') {
        contentHtml = `
          <div class="rounded-lg overflow-hidden my-1 cursor-pointer group relative" onclick="openLightbox('${msg.mediaUrl}', '${msg.caption || ''}')">
            <img src="${msg.mediaUrl}" class="w-full max-h-60 object-cover rounded-lg group-hover:scale-105 transition duration-300" loading="lazy">
            <div class="absolute inset-0 bg-black/20 group-hover:bg-transparent transition"></div>
          </div>
          ${msg.caption ? `<p class="text-sm text-slate-200 mt-1">${msg.caption}</p>` : ''}
        `;
      } else if (msg.type === 'map') {
        contentHtml = `
          <div class="bg-[#111b21] rounded-lg p-2.5 border border-slate-700/50 space-y-1.5 my-1">
            <div class="flex items-center gap-2 text-emerald-400 font-medium text-xs">
              <i class="fa-solid fa-location-dot text-red-400 text-sm"></i>
              <span>${msg.locationName}</span>
            </div>
            <p class="text-[11px] text-slate-400 font-mono">${msg.coords}</p>
            <div class="h-24 bg-slate-800 rounded-md overflow-hidden relative border border-slate-700 flex items-center justify-center">
              <img src="https://images.unsplash.com/photo-1524661135-423995f22d0b?auto=format&fit=crop&w=600&q=80" class="w-full h-full object-cover opacity-60">
              <div class="absolute w-6 h-6 bg-red-500/30 rounded-full flex items-center justify-center animate-ping"></div>
              <i class="fa-solid fa-location-dot text-red-500 text-xl absolute"></i>
            </div>
          </div>
          ${msg.caption ? `<p class="text-sm text-slate-200 mt-1">${msg.caption}</p>` : ''}
        `;
      } else if (msg.type === 'voice') {
        contentHtml = `
          <div class="flex items-center gap-3 bg-[#111b21]/60 p-2 rounded-lg border border-slate-700/40 my-1">
            <button onclick="playVoiceNote(this)" class="w-8 h-8 rounded-full bg-emerald-500 text-slate-950 flex items-center justify-center flex-shrink-0 hover:scale-105 transition">
              <i class="fa-solid fa-play text-xs ml-0.5"></i>
            </button>
            <div class="flex-1 space-y-1">
              <div class="flex items-center gap-1 h-4">
                <div class="w-1 bg-emerald-400 h-2 rounded-full"></div>
                <div class="w-1 bg-emerald-400 h-4 rounded-full"></div>
                <div class="w-1 bg-emerald-400 h-3 rounded-full"></div>
                <div class="w-1 bg-slate-600 h-2 rounded-full"></div>
                <div class="w-1 bg-slate-600 h-3 rounded-full"></div>
                <div class="w-1 bg-slate-600 h-4 rounded-full"></div>
                <div class="w-1 bg-slate-600 h-1 rounded-full"></div>
                <div class="w-1 bg-slate-600 h-3 rounded-full"></div>
              </div>
              <p class="text-[10px] text-slate-400 font-mono">${msg.duration}</p>
            </div>
          </div>
          ${msg.caption ? `<p class="text-xs text-slate-300 italic mt-1">${msg.caption}</p>` : ''}
        `;
      } else {
        contentHtml = `<p class="text-sm text-slate-100 leading-relaxed">${msg.text}</p>`;
      }

      const ticks = isMe ? `<span class="text-cyan-400 text-[10px] ml-1"><i class="fa-solid fa-check-double"></i></span>` : '';

      return `
        <div class="flex ${isMe ? 'justify-end' : 'justify-start'} message-item animate-pop my-1">
          <div class="relative max-w-[82%] sm:max-w-[75%] px-3 py-2 rounded-xl shadow-sm ${isMe ? 'bubble-out' : 'bubble-in'}">
            ${!isMe ? `<p class="text-[11px] font-semibold ${pInfo.color} mb-0.5">${pInfo.name}</p>` : ''}
            ${contentHtml}
            <div class="flex items-center justify-end gap-1 mt-1 text-[10px] text-slate-400">
              <span>${msg.time}</span>
              ${ticks}
            </div>
            ${reactionsHtml}
          </div>
        </div>
      `;
    }

    function renderAllMessagesUntil(index) {
      const list = document.getElementById('messagesList');
      list.innerHTML = '';
      for (let i = 0; i <= index && i < fullChatHistory.length; i++) {
        list.innerHTML += createMessageMarkup(fullChatHistory[i]);
      }
      currentDisplayedIndex = index;
      scrollToBottom();
    }

    function scrollToBottom() {
      const container = document.getElementById('chatContainer');
      container.scrollTo({ top: container.scrollHeight, behavior: 'smooth' });
    }

    function toggleAutoPlay() {
      if (isPlaying) {
        pauseAutoPlay();
      } else {
        startAutoPlay();
      }
    }

    function startAutoPlay() {
      if (currentDisplayedIndex >= fullChatHistory.length - 1) {
        currentDisplayedIndex = 0;
        document.getElementById('messagesList').innerHTML = '';
      }
      isPlaying = true;
      document.getElementById('playIcon').className = 'fa-solid fa-pause text-xs';
      document.getElementById('playStatus').innerText = 'Playing...';
      playNextMessage();
    }

    function pauseAutoPlay() {
      isPlaying = false;
      clearTimeout(autoPlayTimer);
      hideTyping();
      document.getElementById('playIcon').className = 'fa-solid fa-play ml-0.5 text-xs';
      document.getElementById('playStatus').innerText = 'Paused';
    }

    function playNextMessage() {
      if (!isPlaying) return;

      if (currentDisplayedIndex >= fullChatHistory.length - 1) {
        pauseAutoPlay();
        document.getElementById('playStatus').innerText = 'Completed 🎉';
        return;
      }

      const nextMsg = fullChatHistory[currentDisplayedIndex + 1];

      // Show typing indicator if message has sender
      if (!nextMsg.isDateDivider && nextMsg.sender) {
        showTyping(participants[nextMsg.sender]?.name || "Someone");
      }

      const delay = (nextMsg.text ? Math.max(1200, nextMsg.text.length * 40) : 1800) / playSpeed;

      autoPlayTimer = setTimeout(() => {
        hideTyping();
        currentDisplayedIndex++;
        const list = document.getElementById('messagesList');
        list.innerHTML += createMessageMarkup(fullChatHistory[currentDisplayedIndex]);
        playPopSFX();
        scrollToBottom();

        // Loop next message
        autoPlayTimer = setTimeout(() => {
          playNextMessage();
        }, 800 / playSpeed);

      }, delay);
    }

    function showTyping(name) {
      const indicator = document.getElementById('typingIndicator');
      const userSpan = document.getElementById('typingUser');
      userSpan.innerText = name;
      userSpan.classList.remove('hidden');
      indicator.classList.remove('hidden');
      scrollToBottom();
    }

    function hideTyping() {
      document.getElementById('typingIndicator').classList.add('hidden');
    }

    function cycleSpeed() {
      if (playSpeed === 1.0) playSpeed = 2.0;
      else if (playSpeed === 2.0) playSpeed = 4.0;
      else playSpeed = 1.0;

      document.getElementById('speedBtn').innerText = playSpeed.toFixed(1) + 'x';
    }

    function resetChat() {
      pauseAutoPlay();
      renderAllMessagesUntil(3);
      document.getElementById('playStatus').innerText = 'Ready';
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      const btn = document.getElementById('soundBtn');
      btn.className = soundEnabled ? 'p-2 hover:bg-[#2a3942] rounded-full transition text-emerald-400' : 'p-2 hover:bg-[#2a3942] rounded-full transition text-slate-500';
    }

    function toggleAspect() {
      const frame = document.getElementById('appFrame');
      frame.classList.toggle('max-w-2xl');
      frame.classList.toggle('max-w-sm');
    }

    function openLightbox(url, caption) {
      document.getElementById('lightboxImg').src = url;
      document.getElementById('lightboxCaption').innerText = caption;
      document.getElementById('lightbox').classList.remove('hidden');
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.add('hidden');
    }

    function toggleInfoModal() {
      document.getElementById('infoModal').classList.toggle('hidden');
    }

    function toggleSearch() {
      const bar = document.getElementById('searchBar');
      bar.classList.toggle('hidden');
      if (!bar.classList.contains('hidden')) {
        document.getElementById('searchInput').focus();
      } else {
        renderAllMessagesUntil(currentDisplayedIndex);
      }
    }

    function filterMessages() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      if (!query) {
        renderAllMessagesUntil(currentDisplayedIndex);
        return;
      }
      const filtered = fullChatHistory.filter(m => m.text && m.text.toLowerCase().includes(query));
      const list = document.getElementById('messagesList');
      list.innerHTML = '';
      filtered.forEach(m => {
        list.innerHTML += createMessageMarkup(m);
      });
    }

    function sendManualMessage() {
      const input = document.getElementById('manualMsgInput');
      const val = input.value.trim();
      if (!val) return;

      const newMsg = {
        id: Date.now(),
        sender: "Stephen (Groom)",
        text: val,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      };

      fullChatHistory.push(newMsg);
      currentDisplayedIndex = fullChatHistory.length - 1;
      const list = document.getElementById('messagesList');
      list.innerHTML += createMessageMarkup(newMsg);
      playPopSFX();
      scrollToBottom();
      input.value = '';
    }

    function openAddMessageModal() {
      document.getElementById('addMsgModal').classList.remove('hidden');
    }

    function closeAddMessageModal() {
      document.getElementById('addMsgModal').classList.add('hidden');
    }

    function submitCustomMessage() {
      const sender = document.getElementById('modalSender').value;
      const text = document.getElementById('modalText').value.trim();
      if (!text) return;

      const newMsg = {
        id: Date.now(),
        sender: sender,
        text: text,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      };

      fullChatHistory.push(newMsg);
      currentDisplayedIndex = fullChatHistory.length - 1;
      const list = document.getElementById('messagesList');
      list.innerHTML += createMessageMarkup(newMsg);
      playPopSFX();
      scrollToBottom();
      closeAddMessageModal();
      document.getElementById('modalText').value = '';
    }

    function openAddMediaModal() {
      document.getElementById('addMediaModal').classList.remove('hidden');
    }

    function closeAddMediaModal() {
      document.getElementById('addMediaModal').classList.add('hidden');
    }

    function submitCustomMedia() {
      const sender = document.getElementById('mediaSender').value;
      const url = document.getElementById('mediaUrl').value.trim() || "https://images.unsplash.com/photo-1515934751635-c81c6bc9a2d8?auto=format&fit=crop&w=800&q=80";
      const caption = document.getElementById('mediaCaption').value.trim();

      const newMsg = {
        id: Date.now(),
        sender: sender,
        type: "image",
        mediaUrl: url,
        caption: caption,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      };

      fullChatHistory.push(newMsg);
      currentDisplayedIndex = fullChatHistory.length - 1;
      const list = document.getElementById('messagesList');
      list.innerHTML += createMessageMarkup(newMsg);
      playPopSFX();
      scrollToBottom();
      closeAddMediaModal();
    }

    function playVoiceNote(btn) {
      playPopSFX();
      btn.innerHTML = '<i class="fa-solid fa-pause text-xs"></i>';
      setTimeout(() => {
        btn.innerHTML = '<i class="fa-solid fa-play text-xs ml-0.5"></i>';
      }, 3000);
    }
  </script>
</body>
</html>
